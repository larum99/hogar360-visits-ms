server:
  port: 8092

spring:
  application:
    name: hogar360-visits-ms
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 30000
  jpa:
    database: MYSQL
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET_KEY}
    expiration-millis: ${JWT_EXPIRATION_MILLIS}

houses:
  service:
    url: ${HOUSES_SERVICE_URL}